<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="codegraph: code intelligence for AI coding agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#151e3d"/>
    </linearGradient>
    <linearGradient id="ibg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2550"/>
      <stop offset="1" stop-color="#0e1430"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5a524" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#dots)"/>

  <!-- icon -->
  <g transform="translate(80 128) scale(0.5625)">
    <rect width="256" height="256" rx="56" fill="url(#ibg)" stroke="#2a3670" stroke-width="3"/>
    <circle cx="128" cy="128" r="58" fill="none" stroke="#f5a524" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="6 7"/>
    <circle cx="128" cy="128" r="92" fill="none" stroke="#f5a524" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="6 9"/>
    <g stroke="#7aa2ff" stroke-width="5" stroke-linecap="round">
      <line x1="128" y1="128" x2="128" y2="70"/><line x1="128" y1="128" x2="178" y2="157"/><line x1="128" y1="128" x2="78" y2="157"/>
    </g>
    <g stroke="#5ce1e6" stroke-width="4" stroke-linecap="round" stroke-opacity="0.75">
      <line x1="128" y1="70" x2="208" y2="82"/><line x1="178" y1="157" x2="128" y2="220"/><line x1="78" y1="157" x2="48" y2="82"/>
    </g>
    <g fill="#5ce1e6"><circle cx="208" cy="82" r="11"/><circle cx="128" cy="220" r="11"/><circle cx="48" cy="82" r="11"/></g>
    <g fill="#7aa2ff"><circle cx="128" cy="70" r="14"/><circle cx="178" cy="157" r="14"/><circle cx="78" cy="157" r="14"/></g>
    <circle cx="128" cy="128" r="22" fill="#f5a524"/><circle cx="128" cy="128" r="9" fill="#141c38"/>
  </g>

  <!-- title -->
  <text x="252" y="200" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#e6edf3" letter-spacing="-1">codegraph</text>
  <text x="254" y="244" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#c3cbd8">Code intelligence for AI coding agents.</text>

  <!-- chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#c9d4ff">
    <rect x="254" y="270" width="150" height="32" rx="16" fill="#7aa2ff" fill-opacity="0.12" stroke="#7aa2ff" stroke-opacity="0.4"/>
    <text x="329" y="291" text-anchor="middle">TypeScript LS</text>
    <rect x="416" y="270" width="110" height="32" rx="16" fill="#5ce1e6" fill-opacity="0.12" stroke="#5ce1e6" stroke-opacity="0.4"/>
    <text x="471" y="291" text-anchor="middle" fill="#c6f6f8">zero deps</text>
    <rect x="538" y="270" width="188" height="32" rx="16" fill="#f5a524" fill-opacity="0.12" stroke="#f5a524" stroke-opacity="0.45"/>
    <text x="632" y="291" text-anchor="middle" fill="#ffe2ad">Claude Code skill</text>
  </g>

  <!-- blast-radius graph -->
  <circle cx="1010" cy="200" r="120" fill="url(#glow)"/>
  <circle cx="1010" cy="200" r="100" fill="none" stroke="#f5a524" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="5 7"/>
  <circle cx="1010" cy="200" r="160" fill="none" stroke="#f5a524" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="5 9"/>

  <g stroke="#5ce1e6" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6">
    <line x1="915" y1="165" x2="870" y2="85"/>
    <line x1="1000" y1="105" x2="1100" y2="60"/>
    <line x1="1100" y1="160" x2="1100" y2="60"/>
    <line x1="1100" y1="160" x2="1168" y2="215"/>
    <line x1="1070" y1="280" x2="1135" y2="335"/>
    <line x1="930" y1="265" x2="990" y2="350"/>
    <line x1="1070" y1="280" x2="990" y2="350"/>
    <line x1="930" y1="265" x2="862" y2="318"/>
  </g>
  <g stroke="#9ece6a" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" stroke-dasharray="3 5">
    <line x1="1100" y1="160" x2="1210" y2="118"/>
    <line x1="915" y1="165" x2="830" y2="200"/>
  </g>
  <g stroke="#7aa2ff" stroke-width="3.5" stroke-linecap="round">
    <line x1="1010" y1="200" x2="915" y2="165"/>
    <line x1="1010" y1="200" x2="1000" y2="105"/>
    <line x1="1010" y1="200" x2="1100" y2="160"/>
    <line x1="1010" y1="200" x2="1070" y2="280"/>
    <line x1="1010" y1="200" x2="930" y2="265"/>
  </g>

  <g fill="#5ce1e6">
    <circle cx="870" cy="85" r="8"/><circle cx="1100" cy="60" r="8"/><circle cx="1168" cy="215" r="8"/>
    <circle cx="1135" cy="335" r="8"/><circle cx="990" cy="350" r="8"/><circle cx="862" cy="318" r="8"/>
  </g>
  <g fill="#9ece6a">
    <rect x="1203" y="111" width="14" height="14" rx="3"/><rect x="823" y="193" width="14" height="14" rx="3"/>
  </g>
  <g fill="#7aa2ff">
    <circle cx="915" cy="165" r="11"/><circle cx="1000" cy="105" r="11"/><circle cx="1100" cy="160" r="11"/>
    <circle cx="1070" cy="280" r="11"/><circle cx="930" cy="265" r="11"/>
  </g>
  <circle cx="1010" cy="200" r="18" fill="#f5a524"/>
  <circle cx="1010" cy="200" r="7" fill="#151e3d"/>
</svg>
