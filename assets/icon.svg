<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="codegraph icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141c38"/>
      <stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5a524" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="70" fill="url(#glow)"/>
  <!-- blast rings -->
  <circle cx="128" cy="128" r="58" fill="none" stroke="#f5a524" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="6 7"/>
  <circle cx="128" cy="128" r="92" fill="none" stroke="#f5a524" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="6 9"/>
  <!-- edges -->
  <g stroke="#7aa2ff" stroke-width="5" stroke-linecap="round" stroke-opacity="0.9">
    <line x1="128" y1="128" x2="128" y2="70"/>
    <line x1="128" y1="128" x2="178" y2="157"/>
    <line x1="128" y1="128" x2="78" y2="157"/>
  </g>
  <g stroke="#5ce1e6" stroke-width="4" stroke-linecap="round" stroke-opacity="0.75">
    <line x1="128" y1="70" x2="208" y2="82"/>
    <line x1="178" y1="157" x2="128" y2="220"/>
    <line x1="78" y1="157" x2="48" y2="82"/>
  </g>
  <!-- depth-2 nodes -->
  <g fill="#5ce1e6">
    <circle cx="208" cy="82" r="11"/>
    <circle cx="128" cy="220" r="11"/>
    <circle cx="48" cy="82" r="11"/>
  </g>
  <!-- depth-1 nodes -->
  <g fill="#7aa2ff">
    <circle cx="128" cy="70" r="14"/>
    <circle cx="178" cy="157" r="14"/>
    <circle cx="78" cy="157" r="14"/>
  </g>
  <!-- changed (money-path) node -->
  <circle cx="128" cy="128" r="22" fill="#f5a524"/>
  <circle cx="128" cy="128" r="9" fill="#141c38"/>
</svg>
